version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securecode-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/firebase-service-account.json:/app/backend/firebase-service-account.json:ro
    environment:
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
      - CORS_ALLOW_METHODS=["GET","POST"]
      - CORS_ALLOW_HEADERS=["Authorization","Content-Type"]
      - FIREBASE_PROJECT_ID=your-firebase-project-id
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/backend/firebase-service-account.json
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securecode-ai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
    depends_on:
      - backend
